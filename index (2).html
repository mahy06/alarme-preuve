<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alarme Preuve – Test 1 (v0.3)</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #0f172a; color: #f1f5f9; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { color: #94a3b8; line-height: 1.5; margin: 0 0 16px; }
  button { display: block; width: 100%; padding: 16px; margin: 12px 0; font-size: 17px; border: 0; border-radius: 12px; background: #38bdf8; color: #0f172a; font-weight: 700; }
  button.sec { background: #334155; color: #f1f5f9; }
  #timer { font-size: 44px; text-align: center; margin: 16px 0; font-variant-numeric: tabular-nums; }
  #log { white-space: pre-wrap; background: #1e293b; border-radius: 12px; padding: 14px; font-size: 14px; min-height: 80px; }
</style>
</head>
<body>
  <h1>⏰ Alarme Preuve – Test 1 (v0.3)</h1>
  <p>Objectif : vérifier que l'alarme sonne à l'heure, même téléphone verrouillé.</p>

  <button id="b1">1. Autoriser les alarmes</button>
  <button id="b2">2. Sonner dans 1 minute (app ouverte)</button>
  <button id="b3" class="sec">3. Sonner dans 5 minutes (écran verrouillé)</button>
  <button id="b4" class="sec">4. Sonner dans 30 minutes (test long)</button>
  <button id="b5" class="sec">Voir les alarmes reçues / en attente</button>

  <div id="timer">--:--</div>
  <div id="log">Prêt.</div>

<script src="plugins.js"></script>
<script>
  var cap = window.Capacitor;
  var natif = !!(cap && cap.isNativePlatform && cap.isNativePlatform());
  var LN = window.LocalNotifications ||
           (cap && cap.Plugins && cap.Plugins.LocalNotifications) || null;
  var sourcePlugin = window.LocalNotifications ? 'plugins.js (empaqueté)' :
                     (LN ? 'Capacitor.Plugins' : 'INTROUVABLE');
  var compte = null;
  var CANAL = 'alarme_v1';

  function log(message) {
    var el = document.getElementById('log');
    var h = new Date().toLocaleTimeString('fr-FR');
    el.textContent = h + ' – ' + message + '\n' + el.textContent;
  }

  function erreur(err) {
    log('Erreur : ' + (err && err.message ? err.message : err));
  }

  function decompte(finMs) {
    if (compte) clearInterval(compte);
    compte = setInterval(function () {
      var reste = Math.max(0, Math.round((finMs - Date.now()) / 1000));
      var m = String(Math.floor(reste / 60)).padStart(2, '0');
      var s = String(reste % 60).padStart(2, '0');
      document.getElementById('timer').textContent = m + ':' + s;
      if (reste === 0) clearInterval(compte);
    }, 500);
  }

  function verifier() {
    if (!natif || !LN) {
      log("Ouvre l'application installée sur le téléphone (pas un navigateur).");
      return false;
    }
    return true;
  }

  async function autoriser() {
    if (!verifier()) return;
    try {
      var p = await LN.requestPermissions();
      log('Notifications : ' + p.display);
      var e = await LN.checkExactNotificationSetting();
      log('Alarmes exactes : ' + e.exact_alarm);
      if (e.exact_alarm !== 'granted') {
        log('Les réglages vont s\'ouvrir : autorise « Alarmes et rappels ».');
        await LN.changeExactNotificationSetting();
      }
      await LN.createChannel({
        id: CANAL,
        name: 'Alarmes',
        description: 'Sonnerie des alarmes',
        sound: 'alarme.wav',
        importance: 5,
        visibility: 1,
        vibration: true
      });
      var liste = await LN.listChannels();
      var c = (liste.channels || []).filter(function (x) { return x.id === CANAL; })[0];
      log('Canal : ' + JSON.stringify(c));
      log('Canal « Alarmes » créé.');
    } catch (err) { erreur(err); }
  }

  async function programmer(id, minutes) {
    if (!verifier()) return;
    try {
      var quand = new Date(Date.now() + minutes * 60000);
      await LN.schedule({
        notifications: [{
          id: id,
          title: '⏰ Alarme test (' + minutes + ' min)',
          body: 'Mission : fais ton lit !',
          channelId: CANAL,
          schedule: { at: quand, allowWhileIdle: true }
        }]
      });
      log('Alarme programmée pour ' + quand.toLocaleTimeString('fr-FR'));
      decompte(quand.getTime());
    } catch (err) { erreur(err); }
  }

  async function voir() {
    if (!verifier()) return;
    try {
      var d = await LN.getDeliveredNotifications();
      var p = await LN.getPending();
      log('Reçues (encore dans les notifications) : ' + d.notifications.length +
          ' | En attente : ' + p.notifications.length);
    } catch (err) { erreur(err); }
  }

  document.getElementById('b1').onclick = autoriser;
  document.getElementById('b2').onclick = function () { programmer(1, 1); };
  document.getElementById('b3').onclick = function () { programmer(2, 5); };
  document.getElementById('b4').onclick = function () { programmer(3, 30); };
  document.getElementById('b5').onclick = voir;

  if (LN) {
    try {
      LN.addListener('localNotificationReceived', function (n) {
        var etat = document.visibilityState === 'visible' ? 'app ouverte' : 'app en arrière-plan';
        log('Alarme reçue (' + etat + ') : ' + n.title);
      });
      LN.addListener('localNotificationActionPerformed', function () {
        log('Tu as touché la notification.');
      });
    } catch (e) {}
  }
  log('Plugin notifications : ' + sourcePlugin);
  if (!natif) log("Tu es dans un navigateur : l'alarme ne marchera que dans l'app installée.");
</script>
</body>
</html>
